<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EsToDoList</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen ">

  <header class="bg-indigo-600 text-white">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl md:text-3xl font-bold">EsToDoList</h1>
      <span class="hidden md:block text-sm">Organize sua rotina escolar</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 grid grid-cols-1 gap-6 lg:grid lg:grid-cols-3 lg:gap-10  ">

    <!-- Coluna 1: criar, pesquisar e filtrar -->
    <!-- ALTERADO: self-start (altura só do conteúdo, não estica até o fim da lista)
                   lg:sticky lg:top-4 (fica fixa ao rolar a página no desktop) -->
    <section class="bg-white rounded-xl shadow p-4 space-y-4 h-auto self-start lg:sticky lg:top-4">
      <form class="flex flex-col md:flex-row lg:flex-col gap-3 lg:col-span-1">
        <input type="text" placeholder="Nova tarefa"
          class="border rounded-lg px-3 py-3 md:flex-auto hover:ring-2 ring-indigo-500 ">
        <input type="date" class="border rounded-lg px-3 py-3  hover:ring-2 ring-indigo-500 ">
        <button type="submit"
          class="bg-indigo-600 text-white rounded-lg px-4 py-3 font-semibold hover:bg-indigo-800 transition-colors duration-500">Adicionar</button>
      </form>

      <input type="search" placeholder="Pesquisar tarefa..."
        class="w-full border rounded-lg px-3 py-3  hover:ring-2 ring-indigo-500">

      <div class="flex gap-2 overflow-x-auto lg:flex-wrap">
        <button class="px-4 py-3 rounded-full bg-indigo-600 text-white whitespace-nowrap">Todas</button>
        <button class="px-4 py-3 rounded-full bg-slate-200 whitespace-nowrap">Pendentes</button>
        <button class="px-4 py-3 rounded-full bg-slate-200 whitespace-nowrap">Concluídas</button>
      </div>
    </section>

    <!-- Coluna 2: lista de tarefas -->
    <section class="lg:col-span-2">
      <ul class="space-y-3 ">
        <li class="bg-white rounded-xl shadow p-4 flex flex-col  md:flex-row gap-3 md:justify-between  ">
          <label class="flex items-start gap-3">
            <input type="checkbox" class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium">Trabalho de História</span>
              <span class="text-sm text-slate-500">20/10/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col  md:flex-row md:justify-between gap-3 ">
          <label class="flex items-start gap-3">
            <input type="checkbox" class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium">Estudar para a prova de Matemática</span>
              <span class="text-sm text-slate-500">22/10/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3 ">
          <label class="flex items-start gap-3">
            <input type="checkbox" checked class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium line-through text-slate-400">Entregar projeto no GitHub</span>
              <span class="text-sm text-slate-500">08/10/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3 ">
          <label class="flex items-start gap-3">
            <input type="checkbox" class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium">Ler capítulo 5 de Biologia</span>
              <span class="text-sm text-slate-500">23/10/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3 ">
          <label class="flex items-start gap-3">
            <input type="checkbox" class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium">Redação de Português sobre meio ambiente</span>
              <span class="text-sm text-slate-500">24/10/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3 ">
          <label class="flex items-start gap-3">
            <input type="checkbox" checked class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium line-through text-slate-400">Lista de exercícios de Física</span>
              <span class="text-sm text-slate-500">15/10/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3 ">
          <label class="flex items-start gap-3">
            <input type="checkbox" class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium">Preparar seminário de Geografia</span>
              <span class="text-sm text-slate-500">26/10/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3 ">
          <label class="flex items-start gap-3">
            <input type="checkbox" class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium">Revisar conteúdo de Química</span>
              <span class="text-sm text-slate-500">27/10/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3 ">
          <label class="flex items-start gap-3">
            <input type="checkbox" checked class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium line-through text-slate-400">Praticar inglês no aplicativo</span>
              <span class="text-sm text-slate-500">18/10/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3 ">
          <label class="flex items-start gap-3">
            <input type="checkbox" class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium">Montar o layout do projeto de Programação</span>
              <span class="text-sm text-slate-500">28/10/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3 ">
          <label class="flex items-start gap-3">
            <input type="checkbox" class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium">Resumo de Filosofia sobre Sócrates</span>
              <span class="text-sm text-slate-500">29/10/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3 ">
          <label class="flex items-start gap-3">
            <input type="checkbox" class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium">Pagar a mensalidade do curso de inglês</span>
              <span class="text-sm text-slate-500">30/10/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
          </div>
        </li>

        <li class="bg-white rounded-xl shadow p-4 flex flex-col md:flex-row md:justify-between gap-3 ">
          <label class="flex items-start gap-3">
            <input type="checkbox" class="mt-1 w-5 h-5">
            <span>
              <span class="block font-medium">Organizar o material para a feira de ciências</span>
              <span class="text-sm text-slate-500">03/11/2026</span>
            </span>
          </label>
          <div class="flex gap-2">
            <button class="flex-1 px-4 py-3 rounded-lg bg-amber-100">Editar</button>
            <button class="flex-1 px-4 py-3 rounded-lg bg-red-100 text-red-700">Excluir</button>
          </div>
        </li>
      </ul>

      <p class="mt-4 text-sm text-slate-500">10 tarefas pendentes</p>
    </section>

  </main>

</body>

</html>
